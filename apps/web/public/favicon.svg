<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Glow filter -->
  <defs>
    <filter id="pumpkinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pumpkin Stem -->
  <path d="M30 5 C30 5, 32 15, 27 18 C33 16, 38 12, 36 5 C33 7, 31 6, 30 5 Z" fill="#33691E" stroke="#1B5E20" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Outer Pumpkin Lobes -->
  <ellipse cx="18" cy="38" rx="14" ry="19" fill="#E65100"/>
  <ellipse cx="46" cy="38" rx="14" ry="19" fill="#E65100"/>
  
  <!-- Mid Pumpkin Lobes -->
  <ellipse cx="24" cy="38" rx="16" ry="21" fill="#F57C00"/>
  <ellipse cx="40" cy="38" rx="16" ry="21" fill="#F57C00"/>
  
  <!-- Center Pumpkin Lobe -->
  <ellipse cx="32" cy="38" rx="14" ry="22" fill="#FB8C00"/>
  
  <!-- Top indents -->
  <path d="M26 17 C28 20, 36 20, 38 17" stroke="#BF360C" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sinister Carved Eyes with Internal Glow -->
  <polygon points="21,27 27,33 17,35" fill="#210500"/>
  <polygon points="22,28.5 26,32.5 18.5,34" fill="#FFD54F" filter="url(#pumpkinGlow)"/>

  <polygon points="43,27 37,33 47,35" fill="#210500"/>
  <polygon points="42,28.5 38,32.5 45.5,34" fill="#FFD54F" filter="url(#pumpkinGlow)"/>

  <!-- Sinister Carved Triangle Nose -->
  <polygon points="32,34 28,40 36,40" fill="#210500"/>
  <polygon points="32,35.5 29.5,39.5 34.5,39.5" fill="#FFE082"/>

  <!-- Sinister Carved Jagged Smile with Sharp Fangs -->
  <path d="M16 43 Q32 58 48 43 C44 48 42 45 40 47 C38 45 35 49 32 46 C29 49 26 45 24 47 C22 45 20 48 16 43 Z" fill="#210500"/>
  <path d="M17.5 44 Q32 56.5 46.5 44 C43.5 47.5 41.5 45 39.5 46.5 C37.5 44.5 34.5 48 32 45.5 C29.5 48 26.5 44.5 24.5 46.5 C22.5 45 20.5 47.5 17.5 44 Z" fill="#FFCA28" filter="url(#pumpkinGlow)"/>
</svg>
