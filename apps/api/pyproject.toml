[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gravecast-api"
version = "0.1.0"
description = "Gravecast backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.1",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "boto3>=1.35",
    "pyyaml>=6.0",
    # tomllib is built in from Python 3.11; tomli is the same parser for 3.10.
    "tomli>=2.0; python_version < '3.11'",
    # The repo graveyard's code rules parse source with tree-sitter (docs/REPO_SCAN_DESIGN.md §2).
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "moto[dynamodb]>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
