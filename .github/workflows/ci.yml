name: CI

# Backend only. Vercel builds the website and Groove UI on every push.
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
